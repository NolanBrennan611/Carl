[project]
name = "carl"
version = "0.1.0"
description = "Private household Discord bot: grocery list, to-dos, bill reminders"
requires-python = ">=3.12"
dependencies = [
    "discord.py~=2.7",
    "aiosqlite>=0.20",
    "tzdata>=2024.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"src/carl/clock.py" = ["DTZ"]
"tests/**" = ["DTZ"]
